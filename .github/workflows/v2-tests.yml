name: v2 tests

on:
  push:
    branches:
      - v2-workflow-rebuild
    paths:
      - "whatsapp_digest/**"
      - "tests/test_v2_*.py"
      - "config.example.yaml"
      - "pyproject.toml"
      - ".github/workflows/v2-tests.yml"
  pull_request:
    paths:
      - "whatsapp_digest/**"
      - "tests/test_v2_*.py"
      - "config.example.yaml"
      - "pyproject.toml"
      - ".github/workflows/v2-tests.yml"

concurrency:
  group: v2-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: pytest -q tests/test_v2_*.py
