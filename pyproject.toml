[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-tech-digest"
version = "2.3.0"
description = "Read-only WhatsApp group collector and scheduled technical digest pipeline"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
digest = "whatsapp_digest.cli:main"

[tool.setuptools.packages.find]
include = ["whatsapp_digest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
