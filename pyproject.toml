[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-tech-digest"
version = "1.2.0"
description = "Offline, fail-closed WhatsApp TechTeam digest reference implementation"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
digest = "whatsapp_digest.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
