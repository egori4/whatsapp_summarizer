[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-tech-digest"
version = "1.0.0"
description = "Offline, fail-closed WhatsApp TechTeam digest reference implementation"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
