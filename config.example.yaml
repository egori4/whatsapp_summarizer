paths:
  database: ./data/messages.db
  log: ./logs/digest.log

retention:
  processed_raw_days: 7
  log_days: 30
  digest_days: 30  # local validated daily/weekly JSON; independent of raw retention

context:
  enabled: true
  lookback: 48h
  max_messages: 100

hermes:
  command: hermes
  timeout_seconds: 600

whatsapp:
  bridge_url: http://127.0.0.1:3001
  poll_interval_seconds: 1

email:
  host: smtp.example.com
  port: 587
  sender: digest@example.com
  username: digest@example.com
  password_env: WHATSAPP_DIGEST_SMTP_PASSWORD
  starttls: true
  timeout_seconds: 30

defaults:
  timezone: America/Toronto

workflows:
  - id: global-ps
    name: Global PS Technical Digest
    group_jid: "1234567890-1234567890@g.us"
    schedule:
      type: daily
      at: "08:00"
    model:
      provider: inherit
      name: inherit
      reasoning: inherit
    summarization:
      instructions: |
        The digest is for technical team awareness: known issues, updates, lessons,
        confirmed guidance, explicit do's/don'ts, and source-backed follow-up.
        Focus on technical problems, troubleshooting, root cause, fixes,
        versions, workarounds, useful commands and links, important
        administrative announcements, explicit actions, and unanswered
        technical questions.
        Do not invent recommendations or next steps merely because they would be reasonable.
        Actions and do's/don'ts must be explicitly supported by the conversation.
        Lead with the technical finding rather than recounting the conversation.
        Keep the issue, resolution or candidate workaround, precise technical details,
        and status. Preserve relevant technical contributors so colleagues can follow up.
        If only part of a multi-part question is answered, preserve the unanswered part rather than implying full resolution.
      sections:
        - id: technical_updates
          title: Technical Updates
          guidance: Technical issues, troubleshooting, fixes, versions, confirmed guidance, limitations, and material administrative updates.
        - id: actions
          title: Actions / Follow-up
          guidance: Only explicit requested, assigned, committed, or mandatory follow-up. Do not infer recommended next steps.
        - id: unanswered
          title: Unanswered Technical Questions
          guidance: Important technical questions or sub-questions that the supplied messages clearly leave unresolved. Do not duplicate a topic already fully represented elsewhere unless the unresolved part is materially distinct.
    weekly_summary:
      enabled: false  # opt in after deployment; no weekly timer while disabled
      schedule:
        type: weekly
        days: [mon]
        at: "08:30"  # after the daily 08:00 job; same timezone
    delivery:
      email:
        to:
          - user@example.com
        cc: []
        bcc: []
        attach_raw_messages: true
        subject: "[TechTeam Daily] {date} — {workflow_name}"
